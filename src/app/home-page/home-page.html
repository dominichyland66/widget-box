<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Starblazer Products</title>
  <style>
    /* Reset & base */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f7fa;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: start;
      padding: 1rem;
    }

    .demo-wrapper {
      width: 50vw;
      min-width: 300px;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    header {
      text-align: center;
      margin-bottom: 0.3rem;
    }
    header h1 {
      font-size: 2rem;
      color: #1e1e1e;
      margin-bottom: 0.2rem;
    }
    .subtitle {
      font-size: 0.85rem;
      color: #555;
    }

    .toggle-container {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
    }

    .content {
      display: flex;
      gap: 0.3rem;
    }

    .summary-panel {
      flex: none;
      width: 30%;
      background: #eef;
      border: 1px solid #99c;
      border-radius: 6px;
      padding: 0.2rem;
      font-size: 0.8rem;
    }
    .summary-panel h2 {
      font-size: 1rem;
      margin-bottom: 0.2rem;
    }
    .summary-panel pre {
      white-space: pre-wrap;
      font-size: 0.75rem;
      margin: 0;
    }

    .widget-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      padding: 0.2rem;
    }

    .widget {
      padding: 0.1rem;
      border-bottom: 1px solid #eee;
    }
    .widget:last-child {
      border-bottom: none;
    }

    .button-container {
      margin-top: 0.3rem;
      display: flex;
      justify-content: center;
    }
    .button-container button {
      padding: 0.3rem 0.5rem;
      background: #4A90E2;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    footer {
      text-align: center;
      font-size: 0.7rem;
      color: #888;
      margin-top: 0.3rem;
    }
  </style>
</head>
<body>
  <div class="demo-wrapper">

    <!-- Hero -->
    <header>
      <h1>Starblazer Products</h1>
      <p class="subtitle">
        Starblazer continues to innovate and enhance the rocket industry with unmatched expertise and groundbreaking products. Our commitment to quality and customer satisfaction drives us to excel and lead the industry forward.
      </p>
    </header>

    <!-- Toggle session summary visibility -->
    <div class="toggle-container">
      <label>
        <input type="checkbox" id="toggle-summary" checked>
        Show Session Summary
      </label>
    </div>

    <!-- Main content area -->
    <div class="content">

      <!-- Session Summary on left -->
      <div class="summary-panel" id="summary-panel">
        <h2>Session Summary</h2>
        <app-summary></app-summary>
      </div>

      <!-- Widgets on right -->
      <div class="widget-container">
        <section class="widget"><app-user-details></app-user-details></section>
        <section class="widget"><app-postcode-finder></app-postcode-finder></section>
        <section class="widget"><app-product-picker></app-product-picker></section>
        <section class="widget"><loan-calculator></loan-calculator></section>
        <section class="widget"><app-terms-box></app-terms-box></section>

        <!-- Call to action -->
        <div class="button-container">
          <button onclick="history.back()">Back to Home</button>
        </div>
      </div>

    </div>

    <!-- Footer -->
    <footer>&copy; 2025 Starblazer Inc.</footer>
  </div>

  <!-- polyfills & bundle -->
  <script src="./polyfills.js"></script>
  <script src="./main.js"></script>
  <script>
    // Immediately hide/show based on checkbox and wire up listener
    const toggle = document.getElementById('toggle-summary');
    const panel  = document.getElementById('summary-panel');
    if (toggle && panel) {
      panel.hidden = !toggle.checked;
      toggle.addEventListener('change', () => {
        panel.hidden = !toggle.checked;
      });
    }
  </script>
</body>
</html>
